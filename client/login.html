<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Panoply</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            <a href="index.html" style="color: inherit;">Panoply</a>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Services</a>
            <a href="register.html" class="register-btn">Create Account</a>
        </div>

    </nav>

    <!-- Login Section -->
    <section class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back 👋</h1>

            <p>
                Sign in to continue managing your bookings and connect with trusted professionals.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">

                    <label style="display:flex; align-items:center; gap:8px; font-size:.95rem; color:#64748b;">

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#" style="color:#2563eb; font-weight:600;">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="primary-btn"
                    style="width:100%; border:none; cursor:pointer;"
                >
                    Login
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    Don't have an account?

                    <a href="register.html">
                        Create one here
                    </a>
                </p>

            </div>

        </div>

    </section>

    <script src="js/login.js"></script>

</body>
</html>
