<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Provider Dashboard — Panoply</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/client/css/styles.css"/>
</head>
<body class="dash-body">

<aside class="sidebar">
  <div class="sb-logo"><a href="index.html">pan<em>oply</em></a></div>
  <div class="sb-user">
    <div class="sb-avatar green" id="sidebar-avatar">TJ</div>
    <div class="sb-user-info">
      <p id="sidebar-name">Loading...</p>
      <p id="sidebar-role">Provider</p>
    </div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section-label">Main</div>
    <a href="provider-dashboard.html" class="sb-link active">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
    </a>
    <a href="#" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        My jobs
      </div>
    </a>
    <a href="#" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </div>
    </a>
    <a href="#" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Earnings
      </div>
    </a>
    <div class="sb-section-label">Account</div>
    <a href="#" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </div>
    </a>
    <a href="#" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Settings
      </div>
    </a>
  </nav>
  <div class="sb-bottom">
    <a href="login.html" class="sb-logout" onclick="localStorage.clear()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </a>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Good afternoon, <em id="dashboard-greeting">there.</em></h1>
    </div>
    <div class="topbar-right">
      <div class="avail-toggle">
        <span class="avail-label on" id="avail-label">Available</span>
        <button class="toggle-switch" id="avail-toggle" onclick="toggleAvail()" aria-label="Toggle availability"></button>
      </div>
      <button class="notif-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-dot"></span>
      </button>
    </div>
  </div>

  <div class="page">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card-label">Jobs completed</div>
        <div class="stat-card-val" id="stat-jobs">0</div>
        <div class="stat-card-sub">All time</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Rating score</div>
        <div class="stat-card-val" id="stat-rating">0</div>
        <div class="stat-card-sub">Average rating</div>
      </div>
    </div>

    <!-- AVAILABLE JOBS -->
    <div class="section-card" style="margin-bottom:1.5rem">
      <div class="section-head">
        <h2>Available job requests</h2>
        <button onclick="loadAvailableJobs()" class="see-all">Refresh</button>
      </div>
      <div id="available-jobs">
        <p style="color:var(--muted2);padding:1rem">Loading available jobs...</p>
      </div>
    </div>

    <!-- MY JOBS -->
    <div class="section-card">
      <div class="section-head">
        <h2>My recent jobs</h2>
      </div>
      <div id="my-jobs">
        <p style="color:var(--muted2);padding:1rem">Loading your jobs...</p>
      </div>
    </div>
  </div>
</div>

<script src="/client/js/config.js"></script>
<script src="/client/js/provider-dashboard.js"></script>
</body>
</html>
