<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Edit Profile — Panoply</title>
<link rel="icon" type="image/x-icon" href="/client/images/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/client/images/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/client/images/favicon-16x16.png"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/client/css/styles.css"/>
</head>
<body class="dash-body">

<aside class="sidebar">
  <div class="sb-logo"><a href="index.html">pan<em>oply</em></a></div>
  <div class="sb-user">
    <div class="sb-avatar amber" id="sidebar-avatar">EO</div>
    <div class="sb-user-info">
      <p id="sidebar-name">Loading...</p>
      <p id="sidebar-role">Customer</p>
    </div>
  </div>
  <nav class="sb-nav">
    <div class="sb-section-label">Main</div>
    <a href="#" class="sb-link" id="dashboard-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
    </a>
    <a href="booking.html" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Book a service
      </div>
    </a>
    <a href="booking-history.html" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        My jobs
      </div>
    </a>
    <a href="#" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </div>
    </a>
    <div class="sb-section-label">Account</div>
    <a href="profile.html" class="sb-link active">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </div>
    </a>
    <a href="settings.html" class="sb-link">
      <div class="sb-link-inner">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Settings
      </div>
    </a>
  </nav>
  <div class="sb-bottom">
    <a href="login.html" class="sb-logout" onclick="localStorage.clear()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </a>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left"><h1>Edit <em>profile</em></h1></div>
    <div class="topbar-right">
      <a href="profile.html" class="btn-ghost" style="font-size:0.82rem">Cancel</a>
    </div>
  </div>

  <div class="inner-page">
    <div class="breadcrumb">
      <a href="profile.html">Profile</a>
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      <span>Edit</span>
    </div>

    <!-- PERSONAL INFO -->
    <div class="edit-section">
      <div class="edit-section-head">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Personal information
      </div>
      <div class="edit-section-body">
        <div class="field-2col">
          <div class="field"><label>First name</label><input type="text" id="fname" placeholder="First name"/></div>
          <div class="field"><label>Last name</label><input type="text" id="lname" placeholder="Last name"/></div>
        </div>
        <div class="field"><label>Email address</label><input type="email" id="email" disabled style="opacity:0.5;cursor:not-allowed"/></div>
        <div class="field"><label>Phone number</label><input type="tel" id="phone" placeholder="+234 800 000 0000"/></div>
        <div class="save-row">
          <a href="profile.html" class="btn-cancel">Cancel</a>
          <button class="btn-save" onclick="savePersonalInfo()">Save changes</button>
        </div>
      </div>
    </div>

    <!-- PROFILE INFO -->
    <div class="edit-section">
      <div class="edit-section-head">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile details
      </div>
      <div class="edit-section-body">
        <!-- Customer field -->
        <div class="field" id="address-field">
          <label>Address</label>
          <input type="text" id="address" placeholder="Your address"/>
        </div>
        <!-- Provider fields -->
        <div class="field" id="category-field" style="display:none">
          <label>Trade category</label>
          <select id="category">
            <option value="">Select category</option>
            <option value="Electrical">Electrical</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Cleaning">Cleaning</option>
            <option value="AC_Repair">AC Repair</option>
            <option value="Carpentry">Carpentry</option>
            <option value="Generator">Generator</option>
            <option value="Solar">Solar</option>
            <option value="Painting">Painting</option>
          </select>
        </div>
        <div class="field" id="bio-field" style="display:none">
          <label>Bio</label>
          <textarea id="bio" placeholder="Tell customers about yourself and your experience..."></textarea>
        </div>
        <div class="save-row">
          <button class="btn-save" onclick="saveProfileInfo()">Save changes</button>
        </div>
      </div>
    </div>

    <!-- SECURITY -->
    <div class="edit-section">
      <div class="edit-section-head">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Change password
      </div>
      <div class="edit-section-body">
        <div class="field"><label>Current password</label><input type="password" id="current-pw" placeholder="Enter current password"/></div>
        <div class="field-2col">
          <div class="field"><label>New password</label><input type="password" id="new-pw" placeholder="Min. 8 characters"/></div>
          <div class="field"><label>Confirm new password</label><input type="password" id="confirm-pw" placeholder="Repeat new password"/></div>
        </div>
        <div class="save-row">
          <button class="btn-save" onclick="savePassword()">Update password</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg">Saved</span>
</div>

<script src="/client/js/config.js"></script>
<script src="/client/js/sidebar.js"></script>
<script src="/client/js/edit-profile.js"></script>
</body>
</html>
